{% extends 'base.html' %}
{% block title %}Notices{% endblock %}
{% block page_title %}Notices Board{% endblock %}
{% block content %}
<div class="row g-3">
{% for n in notices %}
  <div class="col-12">
    <div class="card">
      <div class="card-body d-flex gap-3 align-items-start">
        <div class="rounded-circle d-flex align-items-center justify-content-center flex-shrink-0"
             style="width:44px;height:44px;background:#fef3c7">
          <i class="fas fa-bullhorn text-warning"></i>
        </div>
        <div>
          <div class="d-flex align-items-center gap-2 mb-1">
            <span class="badge text-capitalize" style="background:#e0e7ff;color:#3730a3">{{ n.sender_role }}</span>
            <span class="text-muted small">{{ n.date }}</span>
          </div>
          <p class="mb-0">{{ n.message }}</p>
        </div>
      </div>
    </div>
  </div>
{% else %}
  <div class="col-12">
    <div class="card"><div class="card-body text-center text-muted py-5">
      <i class="fas fa-bell-slash fa-2x mb-3 d-block"></i>No notices posted yet
    </div></div>
  </div>
{% endfor %}
</div>
{% endblock %}
