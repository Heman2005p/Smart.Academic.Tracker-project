{% extends 'base.html' %}
{% block title %}Notices{% endblock %}
{% block page_title %}Post Notices{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-5">
    <div class="card">
      <div class="card-body">
        <h6 class="fw-bold mb-3">Post New Notice</h6>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label">Message</label>
            <textarea name="message" class="form-control" rows="5" required placeholder="Write notice here..."></textarea>
          </div>
          <button class="btn btn-warning w-100">
            <i class="fas fa-paper-plane me-2"></i>Post Notice
          </button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-7">
    <div class="card">
      <div class="card-body">
        <h6 class="fw-bold mb-3">All Notices</h6>
        {% for n in notices %}
          <div class="p-3 mb-2 rounded-3 border-start border-4 border-warning" style="background:#fffbeb">
            <div class="d-flex justify-content-between mb-1">
              <span class="badge text-capitalize" style="background:#fef3c7;color:#92400e">{{ n.sender_role }}</span>
              <span class="text-muted small">{{ n.date }}</span>
            </div>
            <p class="mb-0">{{ n.message }}</p>
          </div>
        {% else %}
          <p class="text-muted text-center py-4">No notices posted</p>
        {% endfor %}
      </div>
    </div>
  </div>
</div>
{% endblock %}
