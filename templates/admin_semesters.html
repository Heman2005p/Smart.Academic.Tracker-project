{% extends 'base.html' %}
{% block title %}Semesters{% endblock %}
{% block page_title %}Manage Semesters{% endblock %}
{% block content %}
<div class="row g-3">
  <div class="col-lg-4">
    <div class="card">
      <div class="card-body">
        <h6 class="fw-bold mb-3">Add Semester</h6>
        <form method="POST">
          <div class="mb-3">
            <label class="form-label small fw-bold">Semester Label</label>
            <input type="text" name="sem_label" class="form-control" placeholder="e.g. Semester 1 / 2024-25 Odd" required>
          </div>
          <button type="submit" class="btn btn-success w-100"><i class="fas fa-plus me-1"></i>Add Semester</button>
        </form>
      </div>
    </div>
  </div>
  <div class="col-lg-8">
    <div class="card">
      <div class="card-body">
        <h6 class="fw-bold mb-3">All Semesters</h6>
        <div class="table-responsive">
          <table class="table table-hover">
            <thead><tr><th>ID</th><th>Label</th></tr></thead>
            <tbody>
            {% for s in semesters %}
              <tr>
                <td>{{ s.sem_id }}</td>
                <td class="fw-bold">{{ s.sem_label }}</td>
              </tr>
            {% else %}
              <tr><td colspan="2" class="text-center text-muted py-4">No semesters yet</td></tr>
            {% endfor %}
            </tbody>
          </table>
        </div>
      </div>
    </div>
  </div>
</div>
{% endblock %}
